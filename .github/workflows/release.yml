name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PLAIVO_TRAKT_ID: ${{ secrets.PLAIVO_TRAKT_ID }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global vpk --version 1.2.161
      - run: cargo run -p xtask -- libmpv
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo fetch
      - name: Fetch the previous release for delta updates
        shell: bash
        run: vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --channel win --outputDir target/velopack --token "${{ github.token }}" || echo "No published release to diff against"
      - run: cargo run -p xtask -- installer
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/velopack

  macos:
    runs-on: macos-15
    env:
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- libmpv
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global vpk --version 1.2.161
      - run: cargo fetch
      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials plaivo --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "PLAIVO_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          echo "PLAIVO_SIGN_INSTALL_IDENTITY=Developer ID Installer" >> "$GITHUB_ENV"
          echo "PLAIVO_NOTARY_PROFILE=plaivo" >> "$GITHUB_ENV"
      - name: Fetch the previous release for delta updates
        run: vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --channel osx --outputDir target/velopack --token "${{ github.token }}" || echo "No published release to diff against"
      - run: cargo run -p xtask -- installer
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/velopack

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global vpk --version 1.2.161
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          gh release create "$GITHUB_REF_NAME" --draft --title "Plaivo $GITHUB_REF_NAME" --generate-notes ${prev:+--notes-start-tag "$prev"}
          for channel in win osx; do
            dir=windows; [ "$channel" = osx ] && dir=macos
            vpk upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --channel "$channel" --outputDir "$dir" --tag "$GITHUB_REF_NAME" --releaseName "Plaivo $GITHUB_REF_NAME" --merge
          done

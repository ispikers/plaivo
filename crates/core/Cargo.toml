[package]
name = "plaivo-core"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = "1.1.11"

[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

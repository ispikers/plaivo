[package]
name = "plaivo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { workspace = true, features = ["rustls", "platform-verifier", "json", "gzip"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { workspace = true, features = ["rustls", "json", "gzip"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
